name: DYOR -> Telegram forwarder

on:
  schedule:
    # Har 10 daqiqada ishga tushadi (UTC bo'yicha). Xohlasangiz o'zgartiring.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # "Run workflow" tugmasi orqali qo'lda ham ishga tushirish mumkin

permissions:
  contents: write  # seen_ids.json faylini repoga commit qilish uchun
  actions: write   # workflow'ni GitHub API orqali faol saqlash uchun (pastdagi qadam)

concurrency:
  # Bir vaqtning o'zida faqat bitta run ishlasin (cron va qo'lda ishga
  # tushirish bir-biriga urilib, git push "rejected" bo'lib qolmasligi uchun).
  # Navbatdagi run kutib turadi, avvalgisi tugagach ishga tushadi.
  group: dyor-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Botni ishga tushirish
        id: run_bot
        env:
          DYOR_EMAIL: ${{ secrets.DYOR_EMAIL }}
          DYOR_PASSWORD: ${{ secrets.DYOR_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          # Ixtiyoriy: qisqa EN+UZ mazmun uchun (bo'lmasa xabar mazmunsiz ketadi)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Ixtiyoriy: Telegram Mini App havolasi (bo'lmasa TradingView sayti ochiladi)
          CHART_APP_LINK: ${{ secrets.CHART_APP_LINK }}
        run: python bot.py

      - name: Holatni (seen_ids.json, filters.json) repoga saqlash
        # "always()": bot.py xato bilan to'xtagan taqdirda ham, shu paytgacha
        # yuborilgan postlar holati va admin filter o'zgarishlari yo'qolib
        # ketmasin (aks holda ular keyingi runda qayta yuborilishi yoki
        # tugma bosishlari yo'qolib qolishi mumkin edi).
        if: always()
        run: |
          git config user.name "dyor-bot"
          git config user.email "dyor-bot@users.noreply.github.com"
          git add seen_ids.json filters.json
          if git diff --staged --quiet; then
            echo "O'zgarish yo'q, commit qilinmadi."
          else
            git commit -m "chore: update seen posts state and filters"
            # Qo'shimcha xavfsizlik: push'dan oldin remote'dagi eng so'nggi
            # holatni tortib, uning ustiga qo'yamiz (concurrency guard baribir
            # asosiy himoya, lekin bu ikkinchi darajali strahovka).
            git pull --rebase origin main
            git push
          fi

      - name: Workflow'ni faol saqlash (60 kunlik auto-disable bo'lmasligi uchun)
        # GitHub qoidasi: repoda 60 kun faollik bo'lmasa, scheduled workflow
        # avtomatik o'chiriladi. Buni oldini olish uchun GitHub API'ning
        # "enable workflow" chaqiruvini to'g'ridan-to'g'ri qilamiz (runner'da
        # oldindan o'rnatilgan `gh` CLI orqali, tashqi action'siz).
        # AVVAL bu yerda gautamkrishnar/keepalive-workflow action'i edi — u
        # GitHub tomonidan BLOKLANDI va barcha run'lar "Repository access
        # blocked" xatosi bilan boshlanmasdanoq to'xtab qolardi.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bot.yml/enable" && echo "Workflow faol holatda."

      - name: Xatolik bo'lsa, admin'ga Telegram orqali xabar berish
        # Bot login qila olmasa, sayt strukturasi o'zgarib qolsa yoki
        # boshqa sabab bilan run muvaffaqiyatsiz tugasa — bu haqda alohida
        # (kanaldan tashqari) shaxsiy/xizmat chatiga ogohlantirish keladi.
        # ADMIN_CHAT_ID sozlanmagan bo'lsa, bu qadam shunchaki o'tkazib
        # yuboriladi (xatoga sabab bo'lmaydi).
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$ADMIN_CHAT_ID" ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            MSG=$(printf '⚠️ DYOR bot ishga tushishda xatolik yuz berdi.\nRepo: %s\nRun: %s\nLoglarni tekshiring.' "${GITHUB_REPOSITORY}" "${RUN_URL}")
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              > /dev/null
            echo "Admin'ga xato haqida xabar yuborildi."
          else
            echo "ADMIN_CHAT_ID (yoki BOT_TOKEN) o'rnatilmagan, xato xabari yuborilmadi. README'dagi qo'shimcha sozlash bo'limiga qarang."
          fi
